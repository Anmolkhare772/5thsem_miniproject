
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic HTML document configuration -->
    <meta charset="UTF-8">

    <!-- Responsive layout for desktop, tablet and mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser theme configuration -->
    <meta name="theme-color" content="#0b1020">

    <!-- Project information -->
    <meta
        name="description"
        content="SyncForge is a real-time collaborative code editor demonstration using React and a client-side Operational Transformation approach."
    >

    <meta name="author" content="Anmol Khare">

    <meta
        name="keywords"
        content="SyncForge, React, Collaborative Editor, Operational Transformation, Code Editor"
    >

    <!-- Browser tab title -->
    <title>SyncForge | Real-Time Collaborative Editor</title>

    <!-- Original project stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <!-- Preconnect for improved resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body>

    <!-- Main application container -->
    <div id="root">

        <!-- Fallback message before React loads -->
        <noscript>
            <div>
                <h2>JavaScript Required</h2>
                <p>
                    Please enable JavaScript in your browser
                    to use the SyncForge collaborative editor.
                </p>
            </div>
        </noscript>

    </div>

    <!-- React application entry point -->
    <script
        type="module"
        src="/src/main.jsx">
    </script>

</body>

</html>
